<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>羽球輪替抽籤</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#eef4ff;background:#101827}*{box-sizing:border-box}body{margin:0}main{max-width:520px;margin:auto;padding:22px 16px 60px}h1{font-size:27px;margin:10px 0}h2{font-size:18px;margin:0 0 12px}.muted{color:#a8b7cd;font-size:13px;line-height:1.6}.card{background:#1b2940;border:1px solid #30415a;border-radius:18px;padding:17px;margin:15px 0}.row{display:flex;gap:9px;align-items:center}.row>*{min-width:0}input{background:#101827;border:1px solid #42536d;border-radius:11px;color:white;font-size:16px;padding:12px;width:100%}button{border:0;border-radius:12px;padding:12px 15px;background:#30445f;color:white;font-size:15px;font-weight:700;cursor:pointer}button.primary{background:#a7f16d;color:#17240e}button:disabled{opacity:.4}.full{width:100%;margin-top:10px}.pill{display:inline-block;background:#30445f;padding:5px 10px;border-radius:99px;font-size:12px;margin:4px 5px 4px 0}.person{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #30415a}.person:last-child{border:0}.person button{padding:6px 10px}.match{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}.team{background:#253b52;border-radius:14px;padding:16px 5px;font-size:17px;font-weight:750;line-height:1.8}.vs{font-size:13px;color:#a7f16d;font-weight:800}.note{margin:12px 0 0}.history{border-top:1px solid #34445c;padding:10px 0;font-size:13px;line-height:1.7}.history:first-child{border-top:0}.accent{color:#a7f16d}.hide{display:none}</style></head><body><main><div class="muted">BADMINTON · LOCAL DRAW</div><h1>🏸 羽球輪替抽籤</h1><div class="muted">5–8 人雙打｜公平輪休｜隨機隊友｜單一球場</div><section class="card"><h2>球友名單 <span id="count" class="accent">0 / 8</span></h2><div class="row"><input id="name" maxlength="18" placeholder="輸入球友名稱"><button id="add" class="primary">加入</button></div><div id="people"></div><p class="muted">至少 5 人開始，最多 8 人。名單變更會重設目前場次。</p><button id="start" class="primary full">開始抽籤</button></section><section class="card hide" id="game"><div class="row" style="justify-content:space-between"><h2>第 <span id="round">1</span> 場</h2><span class="pill" id="phase">隨機對戰</span></div><div class="match"><div class="team" id="left"></div><div class="vs">VS</div><div class="team" id="right"></div></div><div class="note muted" id="rest"></div><button id="next" class="primary full">完成本場・安排下一場</button><button id="undo" class="full">重新抽本場（不計入紀錄）</button></section><section class="card hide" id="stats"><h2>上場統計</h2><div id="scores"></div></section><section class="card hide" id="log"><h2>歷史場次</h2><div id="history"></div><button id="reset" class="full">重設場次紀錄</button></section><p class="muted">抽籤採公平輪休：優先上場次數較少者，並盡量避免重複隊友。8 人時先抽四隊，再隨機抽兩隊上場，另外兩隊下一場上場；兩場完成後才重新分組。資料優先儲存於此裝置瀏覽器；直接開啟本機 HTML 時，部分手機瀏覽器可能不保留資料。</p></main><script>
const KEY='badminton-local-v2';const $=id=>document.getElementById(id);let s={names:[],history:[],current:null,waiting:null,cycle:0};try{let v=localStorage.getItem(KEY);if(v)s=JSON.parse(v)}catch(e){};if(!Array.isArray(s.names))s={names:[],history:[],current:null,waiting:null,cycle:0};
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function pairKey(a,b){return [a,b].sort().join('|')}function counts(){let c=Object.fromEntries(s.names.map(n=>[n,0]));s.history.forEach(g=>g.play.forEach(n=>{if(n in c)c[n]++}));return c}function mates(){let m={};s.history.forEach(g=>g.teams.forEach(t=>{let k=pairKey(...t);m[k]=(m[k]||0)+1}));return m}
function choosePairs(players){let options=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]],m=mates();let ranked=shuffle(options).map(op=>({op,score:op.reduce((sum,p)=>sum+(m[pairKey(players[p[0]],players[p[1]])]||0),0)})).sort((a,b)=>a.score-b.score);return shuffle(ranked[0].op.map(p=>p.map(i=>players[i])))}
function draw(){let n=s.names.length,c=counts(),last=s.history.at(-1),previous=new Set(last?last.play:[]),pool=shuffle(s.names);
if(n===8){
 if(s.waiting&&s.waiting.length===2){let teams=s.waiting.map(t=>[...t]);s.waiting=null;s.current={teams,play:teams.flat(),rest:s.names.filter(x=>!teams.flat().includes(x)),cycle:s.cycle,part:2};}
 else{let ranked=shuffle(pool).sort((a,b)=>c[a]-c[b]||((previous.has(a)?1:0)-(previous.has(b)?1:0)));let first=ranked.slice(0,4),second=ranked.slice(4,8);let teams1=choosePairs(first),teams2=choosePairs(second);let selected=Math.random()<.5?teams1:teams2;let waiting=selected===teams1?teams2:teams1;s.cycle=(s.cycle||0)+1;s.waiting=waiting;s.current={teams:selected,play:selected.flat(),rest:waiting.flat(),cycle:s.cycle,part:1};}
}else{let order=shuffle(pool).sort((a,b)=>c[a]-c[b]||((previous.has(a)?1:0)-(previous.has(b)?1:0)));let eligible=order.slice(0,4),teams=choosePairs(eligible);s.waiting=null;s.current={teams,play:eligible,rest:s.names.filter(x=>!eligible.includes(x))};}
save();render()}
function render(){ $('count').textContent=s.names.length+' / 8';$('people').replaceChildren();s.names.forEach(n=>{let d=document.createElement('div');d.className='person';let a=document.createElement('span');a.textContent=n;let b=document.createElement('button');b.textContent='移除';b.onclick=()=>{if(!confirm('移除 '+n+' 並重設場次？'))return;s.names=s.names.filter(x=>x!==n);s.history=[];s.current=null;s.waiting=null;s.cycle=0;save();render()};d.append(a,b);$('people').append(d)});$('start').disabled=s.names.length<5;$('game').classList.toggle('hide',!s.current);$('stats').classList.toggle('hide',!s.current&&!s.history.length);$('log').classList.toggle('hide',!s.current&&!s.history.length);if(s.current){$('round').textContent=s.history.length+1;$('phase').textContent=s.names.length===8?'第 '+s.current.cycle+' 輪 · '+s.current.part+'/2':'個人輪休';$('left').textContent=s.current.teams[0].join(' ＋ ');$('right').textContent=s.current.teams[1].join(' ＋ ');$('rest').textContent=(s.names.length===8&&s.current.part===1?'候場兩隊（下一場優先上場）：':'休息：')+s.current.rest.join('、')}let c=counts();$('scores').replaceChildren();s.names.forEach(n=>{let d=document.createElement('div');d.className='person';d.textContent=n+'　｜　'+c[n]+' 場';$('scores').append(d)});$('history').replaceChildren();[...s.history].reverse().forEach((g,i)=>{let d=document.createElement('div');d.className='history';d.textContent='第 '+(s.history.length-i)+' 場：'+g.teams.map(t=>t.join('＋')).join(' VS ')+'｜休息：'+g.rest.join('、');$('history').append(d)})}
$('add').onclick=()=>{let n=$('name').value.trim();if(!n)return;if(s.names.length>=8)return alert('最多 8 人');if(s.names.includes(n))return alert('名稱不可重複');if(s.current||s.history.length){if(!confirm('新增人員會重設場次紀錄，確定嗎？'))return;s.history=[];s.current=null;s.waiting=null;s.cycle=0}s.names.push(n);$('name').value='';save();render()};$('name').addEventListener('keydown',e=>{if(e.key==='Enter')$('add').click()});$('start').onclick=()=>{if(s.names.length<5)return;if((s.current||s.history.length)&&!confirm('重新開始並清除目前場次紀錄？'))return;s.history=[];s.current=null;s.waiting=null;s.cycle=0;draw()};$('next').onclick=()=>{if(!s.current)return;s.history.push(s.current);s.current=null;draw()};$('undo').onclick=()=>{if(!s.current)return;if(s.names.length===8&&s.current.part===2){alert('第二場隊伍已鎖定，避免跳過候場球友。');return;}if(s.names.length===8){s.waiting=null;s.cycle=Math.max(0,(s.cycle||1)-1)}draw()};$('reset').onclick=()=>{if(!confirm('確定清除所有場次紀錄？名單會保留。'))return;s.history=[];s.current=null;s.waiting=null;s.cycle=0;save();render()};render();
</script></body></html>
